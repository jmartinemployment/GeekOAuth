name: Deploy Railway

# Deploys only after CI has passed on a push to main; workflow_dispatch is the manual override.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `event == 'push'` excludes pull-request CI runs whose head branch happens to be named main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # For workflow_run this is the commit CI validated, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.74.0

      - name: Deploy GeekOAuth service
        working-directory: .
        run: |
          railway link --project e7aaf7ad-e950-4d80-b579-2b0e1fffd0b3 --environment production --service GeekOAuth
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment URL
        run: echo "Production https://auth.geekatyourspot.com"
