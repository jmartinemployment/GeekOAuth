name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GeekOAuth.slnx

      - name: Build
        run: dotnet build GeekOAuth.slnx --configuration Release --no-restore

      - name: Test (Testcontainers + PKCE E2E)
        run: dotnet test GeekOAuth.slnx --configuration Release --no-build --verbosity normal
